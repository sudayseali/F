name: Deploy Supabase Project (Database & Edge Functions)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Database & Edge Functions
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_AUTH_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_YES: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate GitHub Secrets
        run: |
          echo "=========================================="
          echo "Validating Required GitHub Action Secrets"
          echo "=========================================="
          MISSING=0
          if [ -z "$PROJECT_ID" ]; then
            echo "❌ Missing Secret: SUPABASE_PROJECT_ID"
            MISSING=$((MISSING+1))
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "❌ Missing Secret: SUPABASE_DB_PASSWORD"
            MISSING=$((MISSING+1))
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "❌ Missing Secret: SUPABASE_ACCESS_TOKEN"
            MISSING=$((MISSING+1))
          fi

          if [ $MISSING -gt 0 ]; then
            echo "------------------------------------------"
            echo "Error: Required GitHub Secrets are missing."
            echo "Please go to your GitHub repository -> Settings -> Secrets and variables -> Actions"
            echo "and set SUPABASE_PROJECT_ID, SUPABASE_DB_PASSWORD, and SUPABASE_ACCESS_TOKEN."
            echo "------------------------------------------"
            exit 1
          fi
          echo "✅ All required secrets present."

      - name: Set Environment Secrets on Remote Supabase
        run: |
          echo "Configuring environment variables on remote Supabase project..."
          > .env.func
          [ -n "${{ secrets.SUPABASE_URL }}" ] && echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env.func
          [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ] && echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env.func
          [ -n "${{ secrets.JWT_SECRET }}" ] && echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env.func
          [ -n "${{ secrets.SUPABASE_JWT_SECRET }}" ] && echo "SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }}" >> .env.func
          [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env.func
          [ -n "${{ secrets.FRONTEND_URL }}" ] && echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> .env.func
          [ -n "${{ secrets.ALLOWED_ORIGINS }}" ] && echo "ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}" >> .env.func
          [ -n "${{ secrets.CPX_APP_ID }}" ] && echo "CPX_APP_ID=${{ secrets.CPX_APP_ID }}" >> .env.func
          [ -n "${{ secrets.OFFERWALL_GENERIC_SECRET }}" ] && echo "OFFERWALL_GENERIC_SECRET=${{ secrets.OFFERWALL_GENERIC_SECRET }}" >> .env.func
          [ -n "${{ secrets.AYET_SECRET }}" ] && echo "AYET_SECRET=${{ secrets.AYET_SECRET }}" >> .env.func
          [ -n "${{ secrets.AYET_API_KEY }}" ] && echo "AYET_API_KEY=${{ secrets.AYET_API_KEY }}" >> .env.func
          [ -n "${{ secrets.AYET_ADSLOT_ID }}" ] && echo "AYET_ADSLOT_ID=${{ secrets.AYET_ADSLOT_ID }}" >> .env.func
          [ -n "${{ secrets.TOROX_SECRET }}" ] && echo "TOROX_SECRET=${{ secrets.TOROX_SECRET }}" >> .env.func
          [ -n "${{ secrets.TOROX_API_KEY }}" ] && echo "TOROX_API_KEY=${{ secrets.TOROX_API_KEY }}" >> .env.func
          [ -n "${{ secrets.TOROX_PUB_ID }}" ] && echo "TOROX_PUB_ID=${{ secrets.TOROX_PUB_ID }}" >> .env.func
          [ -n "${{ secrets.TOROX_APP_ID }}" ] && echo "TOROX_APP_ID=${{ secrets.TOROX_APP_ID }}" >> .env.func
          [ -n "${{ secrets.ADGATE_SECRET }}" ] && echo "ADGATE_SECRET=${{ secrets.ADGATE_SECRET }}" >> .env.func
          [ -n "${{ secrets.ADGATE_API_KEY }}" ] && echo "ADGATE_API_KEY=${{ secrets.ADGATE_API_KEY }}" >> .env.func
          [ -n "${{ secrets.ADGATE_AFFILIATE_ID }}" ] && echo "ADGATE_AFFILIATE_ID=${{ secrets.ADGATE_AFFILIATE_ID }}" >> .env.func
          [ -n "${{ secrets.ADGATE_WALL_CODE }}" ] && echo "ADGATE_WALL_CODE=${{ secrets.ADGATE_WALL_CODE }}" >> .env.func
          [ -n "${{ secrets.LOOTABLY_SECRET }}" ] && echo "LOOTABLY_SECRET=${{ secrets.LOOTABLY_SECRET }}" >> .env.func
          [ -n "${{ secrets.LOOTABLY_API_KEY }}" ] && echo "LOOTABLY_API_KEY=${{ secrets.LOOTABLY_API_KEY }}" >> .env.func
          [ -n "${{ secrets.LOOTABLY_PLACEMENT_ID }}" ] && echo "LOOTABLY_PLACEMENT_ID=${{ secrets.LOOTABLY_PLACEMENT_ID }}" >> .env.func
          [ -n "${{ secrets.ADGEM_APP_ID }}" ] && echo "ADGEM_APP_ID=${{ secrets.ADGEM_APP_ID }}" >> .env.func
          [ -n "${{ secrets.ADGEM_API_KEY }}" ] && echo "ADGEM_API_KEY=${{ secrets.ADGEM_API_KEY }}" >> .env.func
          [ -n "${{ secrets.ADGEM_POSTBACK_SECRET }}" ] && echo "ADGEM_POSTBACK_SECRET=${{ secrets.ADGEM_POSTBACK_SECRET }}" >> .env.func
          [ -n "${{ secrets.ADSCEND_PUBLISHER_ID }}" ] && echo "ADSCEND_PUBLISHER_ID=${{ secrets.ADSCEND_PUBLISHER_ID }}" >> .env.func
          [ -n "${{ secrets.ADSCEND_PROFILE_ID }}" ] && echo "ADSCEND_PROFILE_ID=${{ secrets.ADSCEND_PROFILE_ID }}" >> .env.func
          [ -n "${{ secrets.ADSCEND_API_KEY }}" ] && echo "ADSCEND_API_KEY=${{ secrets.ADSCEND_API_KEY }}" >> .env.func
          [ -n "${{ secrets.ADSCEND_POSTBACK_SECRET }}" ] && echo "ADSCEND_POSTBACK_SECRET=${{ secrets.ADSCEND_POSTBACK_SECRET }}" >> .env.func
          [ -n "${{ secrets.CPX_SECRET }}" ] && echo "CPX_SECRET=${{ secrets.CPX_SECRET }}" >> .env.func
          [ -n "${{ secrets.CPA_SECRET }}" ] && echo "CPA_SECRET=${{ secrets.CPA_SECRET }}" >> .env.func
          [ -n "${{ secrets.TAPJOY_SECRET }}" ] && echo "TAPJOY_SECRET=${{ secrets.TAPJOY_SECRET }}" >> .env.func
          [ -n "${{ secrets.TAPJOY_SECRET_KEY }}" ] && echo "TAPJOY_SECRET_KEY=${{ secrets.TAPJOY_SECRET_KEY }}" >> .env.func
          [ -n "${{ secrets.TAPJOY_WALL_URL }}" ] && echo "TAPJOY_WALL_URL=${{ secrets.TAPJOY_WALL_URL }}" >> .env.func
          [ -n "${{ secrets.SYNC_CRON_SECRET }}" ] && echo "SYNC_CRON_SECRET=${{ secrets.SYNC_CRON_SECRET }}" >> .env.func
          [ -n "${{ secrets.TELEGRAM_WEBHOOK_SECRET }}" ] && echo "TELEGRAM_WEBHOOK_SECRET=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}" >> .env.func
          [ -n "${{ secrets.REQUIRED_CHANNEL_ID }}" ] && echo "REQUIRED_CHANNEL_ID=${{ secrets.REQUIRED_CHANNEL_ID }}" >> .env.func
          [ -n "${{ secrets.REQUIRED_CHANNEL_URL }}" ] && echo "REQUIRED_CHANNEL_URL=${{ secrets.REQUIRED_CHANNEL_URL }}" >> .env.func
          if [ -s .env.func ]; then
            supabase secrets set --env-file .env.func --project-ref "$PROJECT_ID"
          fi
          rm -f .env.func

      
      - name: Link Supabase Project
        run: |
          echo "Linking Supabase CLI to project $PROJECT_ID..."
          echo "$SUPABASE_DB_PASSWORD" | supabase link --project-ref "$PROJECT_ID"

      - name: Reconcile Migration History & Push SQL Migrations
        run: |
          if [ ! -d "supabase/migrations" ]; then
            echo "ERROR: Migration directory is missing."
            exit 1
          fi

          echo "Checking remote Supabase migration history..."
          MIG_LIST=$(supabase migration list --remote --password "$SUPABASE_DB_PASSWORD" 2>&1 || true)
          echo "$MIG_LIST"
          # Supabase CLI v3 prints Markdown-formatted tables with backticks (`version` | ` `)
          CLEAN_LIST=$(printf '%s\n' "$MIG_LIST" | tr -d '\140')

          # Detect if remote database already has core tables initialized (e.g. from earlier SQL Editor setup)
          DB_INITIALIZED=0
          API_URL="${{ secrets.SUPABASE_URL }}"
          if [ -z "$API_URL" ]; then
            API_URL="https://${PROJECT_ID}.supabase.co"
          fi

          if [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "${API_URL}/rest/v1/users?select=id&limit=1" \
              -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              DB_INITIALIZED=1
            fi
          fi

          if [ "$DB_INITIALIZED" = "0" ]; then
            if printf '%s\n' "$CLEAN_LIST" | grep -qE '\|[[:space:]]*[0-9]{8,}'; then
              DB_INITIALIZED=1
            elif supabase inspect db table-stats --remote 2>/dev/null | grep -qiE '\busers\b'; then
              DB_INITIALIZED=1
            elif supabase db dump --remote --password "$SUPABASE_DB_PASSWORD" --schema public --schema-only -f /tmp/remote_schema.sql 2>/dev/null && grep -qE 'CREATE TABLE.*"users"|CREATE TABLE.*public\.users' /tmp/remote_schema.sql; then
              DB_INITIALIZED=1
            fi
            rm -f /tmp/remote_schema.sql
          fi

          # If DB is already initialized, mark legacy pre-20260508 bootstrap files as applied
          # so CLI never re-runs destructive legacy scripts (like 20260503000003 DROP TABLE users).
          if [ "$DB_INITIALIZED" = "1" ]; then
            echo "Existing database detected. Checking pre-20260508 baseline migrations..."
            TO_REPAIR=""
            for ver in \
              20240101000000 \
              20260430000001 \
              20260430000002 \
              20260502000000 \
              20260503000003 \
              20260506000000 \
              20260506000001 \
              20260507000000 \
              20260507000001 \
              20260507000002; do
              if ! printf '%s\n' "$CLEAN_LIST" | grep -qE "^[[:space:]]*${ver}[[:space:]]*\|[[:space:]]*${ver}"; then
                TO_REPAIR="$TO_REPAIR $ver"
              fi
            done
            if [ -n "$TO_REPAIR" ]; then
              echo "Marking baseline migrations as applied:$TO_REPAIR"
              supabase migration repair --remote --password "$SUPABASE_DB_PASSWORD" --status applied $TO_REPAIR
            fi
          fi

          # Remove orphan remote-only tracking entries (migrations created outside this repo,
          # such as 20261110191540 / 20261110191657) from schema_migrations so db push proceeds.
          # Note: 'repair --status reverted' only updates the tracking ledger; it never alters DB tables/data.
          LOCAL_VERS=$(ls -1 supabase/migrations/*.sql 2>/dev/null | xargs -n1 basename | cut -d'_' -f1 | tr '\n' ' ')
          ORPHAN_REMOTE=$(printf '%s\n' "$CLEAN_LIST" | awk -F'|' -v locals=" $LOCAL_VERS " '
            NF >= 2 {
              local_col = $1; remote_col = $2;
              gsub(/^[ \t\r]+|[ \t\r]+$/, "", local_col);
              gsub(/^[ \t\r]+|[ \t\r]+$/, "", remote_col);
              if (remote_col ~ /^[0-9]+$/ && (local_col == "" || index(locals, " " remote_col " ") == 0)) {
                printf "%s ", remote_col
              }
            }' | xargs)
          if [ -n "$ORPHAN_REMOTE" ]; then
            echo "Reconciling orphan remote-only migration entries (tracking table only): $ORPHAN_REMOTE"
            supabase migration repair --remote --password "$SUPABASE_DB_PASSWORD" --status reverted $ORPHAN_REMOTE
          fi

          echo "Pushing pending SQL migrations automatically to remote Supabase..."
          supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --include-all --yes
          echo "✅ All pending SQL migrations applied to Supabase."


      - name: Deploy Edge Functions
        run: |
          echo "Deploying all Edge Functions to Supabase..."
          for func in auth withdraw daily_checkin submit_task get_cpx_url cpx_postback cpa_postback postback tapjoy_webhook telegram-webhook verify_task_submission admin_api admin_action alerts offers_api offer_click sync_offers; do
            if [ -d "supabase/functions/$func" ]; then
              echo "Deploying Edge Function: $func"
              supabase functions deploy "$func" --yes --no-verify-jwt
            fi
          done
          echo "✅ Edge Function deployment step completed."
