name: Deploy Supabase Project (Database & Edge Functions)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Database & Edge Functions
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_AUTH_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_YES: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate GitHub Secrets
        run: |
          echo "=========================================="
          echo "Validating Required GitHub Action Secrets"
          echo "=========================================="
          MISSING=0
          if [ -z "$PROJECT_ID" ]; then
            echo "❌ Missing Secret: SUPABASE_PROJECT_ID"
            MISSING=$((MISSING+1))
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "❌ Missing Secret: SUPABASE_DB_PASSWORD"
            MISSING=$((MISSING+1))
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "❌ Missing Secret: SUPABASE_ACCESS_TOKEN"
            MISSING=$((MISSING+1))
          fi

          if [ $MISSING -gt 0 ]; then
            echo "------------------------------------------"
            echo "Error: Required GitHub Secrets are missing."
            echo "Please go to your GitHub repository -> Settings -> Secrets and variables -> Actions"
            echo "and set SUPABASE_PROJECT_ID, SUPABASE_DB_PASSWORD, and SUPABASE_ACCESS_TOKEN."
            echo "------------------------------------------"
            exit 1
          fi
          echo "✅ All required secrets present."

      - name: Set Environment Secrets on Remote Supabase
        run: |
          echo "Configuring environment variables on remote Supabase project..."
          > .env.func
          [ -n "${{ secrets.SUPABASE_URL }}" ] && echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env.func
          [ -n "${{ secrets.JWT_SECRET }}" ] && echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env.func
          [ -n "${{ secrets.SUPABASE_JWT_SECRET }}" ] && echo "JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }}" >> .env.func
          [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env.func
          [ -n "${{ secrets.AYET_SECRET }}" ] && echo "AYET_SECRET=${{ secrets.AYET_SECRET }}" >> .env.func
          [ -n "${{ secrets.TOROX_SECRET }}" ] && echo "TOROX_SECRET=${{ secrets.TOROX_SECRET }}" >> .env.func
          [ -n "${{ secrets.ADGATE_SECRET }}" ] && echo "ADGATE_SECRET=${{ secrets.ADGATE_SECRET }}" >> .env.func
          [ -n "${{ secrets.LOOTABLY_SECRET }}" ] && echo "LOOTABLY_SECRET=${{ secrets.LOOTABLY_SECRET }}" >> .env.func
          [ -n "${{ secrets.CPX_SECRET }}" ] && echo "CPX_SECRET=${{ secrets.CPX_SECRET }}" >> .env.func
          [ -n "${{ secrets.CPA_SECRET }}" ] && echo "CPA_SECRET=${{ secrets.CPA_SECRET }}" >> .env.func
          [ -n "${{ secrets.TAPJOY_SECRET }}" ] && echo "TAPJOY_SECRET=${{ secrets.TAPJOY_SECRET }}" >> .env.func
          [ -n "${{ secrets.TELEGRAM_WEBHOOK_SECRET }}" ] && echo "TELEGRAM_WEBHOOK_SECRET=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}" >> .env.func
          if [ -s .env.func ]; then
            supabase secrets set --env-file .env.func --project-ref "$PROJECT_ID" || echo "Warning: Could not set secrets via CLI, check Supabase permissions..."
          fi
          rm -f .env.func

      
      - name: Link Supabase Project
        run: |
          echo "Linking Supabase CLI to project $PROJECT_ID..."
          echo "$SUPABASE_DB_PASSWORD" | supabase link --project-ref "$PROJECT_ID"

      - name: Validate Migration History
        run: |
          echo "Checking migration history before deployment..."

          if [ ! -d "supabase/migrations" ]; then
            echo "ERROR: Migration directory is missing."
            exit 1
          fi

          echo "Migration directory exists."
          echo "Database migrations are NOT automatically pushed."
          echo "Resolve remote migration history separately before enabling db push."


      - name: Deploy Edge Functions
        run: |
          echo "Deploying all Edge Functions to Supabase..."
          for func in auth withdraw daily_checkin submit_task get_cpx_url cpx_postback cpa_postback postback tapjoy_webhook telegram-webhook verify_task_submission admin_api admin_action; do
            if [ -d "supabase/functions/$func" ]; then
              echo "Deploying Edge Function: $func"
              supabase functions deploy "$func" --yes --no-verify-jwt
            fi
          done
          echo "✅ Edge Function deployment step completed."
